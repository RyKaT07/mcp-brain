name: docker

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─── 1. Unit tests (gate on every push / PR) ──────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # ``embeddings`` extra isn't declared in pyproject; the
          # underlying deps (fastembed / sqlite-vec) are pulled in
          # explicitly so audit_coherence + semantic_search tests
          # don't get skipped here.
          pip install -e '.[dev]' fastembed sqlite-vec numpy

      - name: pytest
        run: |
          # ``test_isolation`` reads the live cgroups path which is
          # mounted differently on GitHub-hosted runners than on the
          # deploy host; skip it here, the deploy host runs the rest.
          pytest -x -q --ignore=tests/test_isolation.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcp-brain
          # Symmetric to mcp-brain-panel: feature → develop → main.
          # - main pushes tag `:latest` for prod compose to pull.
          # - develop pushes tag `:dev` for the dev compose to pull.
          # - PRs build but do not push (push: false on PR events).
          # Branch / PR / sha / semver tags stay so manual rollbacks
          # to a specific commit remain possible via image digest.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
